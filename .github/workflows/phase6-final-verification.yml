name: Phase 6 final verification

on:
  push:
    branches:
      - feat/phase6-disaster-recovery
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Phase 6 focused tests
        run: >-
          npx vitest run
          src/backup/backup-schema.test.ts
          src/backup/backup-service.test.ts
          src/backup/restore-service.test.ts
          src/app/HostBackupPanel.test.tsx
          src/app/host-transfer-import-service.test.ts
          src/app/TransferDemo.test.tsx
          src/backup/disaster-recovery.integration.test.ts
          src/app/phase6-backup-integration.test.tsx
      - name: Literal npm test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
