name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run -- src/domain/exact-decimal.test.ts src/domain/phase1-deterministic-scoring.test.ts src/db/exact-numeric-compatibility.test.ts src/app/ScoringSimulatorExact.test.tsx src/app/TournamentConfigEditorExactConfig.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
