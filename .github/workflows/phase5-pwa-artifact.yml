name: Phase 5 final verification

on:
  push:
    branches:
      - feat/phase5-pwa-offline-safety-data-controls
  pull_request:

permissions:
  contents: read

jobs:
  verify-phase5-final-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Literal npm test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Verify generated offline PWA artifact
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/pwa-192x192.png
          test -f dist/pwa-512x512.png
          grep -q 'index.html' dist/sw.js
          grep -q 'assets/' dist/sw.js
          grep -q "registerType: 'prompt'" vite.config.ts
          grep -q 'skipWaiting: false' vite.config.ts
          grep -q 'clientsClaim: false' vite.config.ts
      - name: Verify no required remote runtime dependency in production source
        run: |
          if grep -RInE 'https?://|fonts\.googleapis|fonts\.gstatic|cdn\.|@import[[:space:]]+url|fetch\(' src index.html public \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='vite-env.d.ts'; then
            echo 'Unexpected remote/runtime network dependency found in production source'
            exit 1
          fi
